# The gate on every push and every PR. The SAME steps as publish, minus the publish.
#
# A tag is the worst moment to find out a test broke: the version has already been decided and the fix becomes a
# new tag. Here the signal arrives on the push that caused it.
#
# There is no `npm ci`: this package has ZERO dependencies, and that is a security decision (it holds a credential
# and talks to somebody's backend). If a `node_modules` ever appears, this step breaks — and it is meant to.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: no dependencies (by design, not by accident)
        run: |
          test ! -d node_modules || { echo "::error::a node_modules appeared — this package has no dependencies"; exit 1; }
          node -e "const d=require('./package.json'); if (d.dependencies && Object.keys(d.dependencies).length) { console.error('::error::declared dependencies: ' + Object.keys(d.dependencies)); process.exit(1); }"
      # ⚠️ `node src/index.mjs` is the DIRECT path, and it is what let 0.1.0 ship broken: npm publishes the `bin` as
      # a symlink, and the main-module guard did not match through it — the command exited 0 printing nothing.
      # Running the file is not running the artifact. The tests below pack, install and call through the binary.
      - run: node --test test/*.test.mjs
