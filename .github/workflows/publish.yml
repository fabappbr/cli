# Publishing @fabappai/cli to npm.
#
# WHY OIDC AND NOT A TOKEN. This package runs on a developer's machine and HOLDS THEIR CREDENTIAL. A leaked publish
# token would let somebody push a version that reads the keychain of everyone who installed it. Trusted Publishing
# swaps the long-lived token for a short-lived OIDC one that npm validates against THIS repository and THIS file —
# there is no secret to leak.
#
# BEFORE THE FIRST RELEASE, on npmjs.com: package Settings → Trusted Publisher → fabappbr / cli / publish.yml.
#
# Triggered by a TAG only. Never by a branch, never from anybody's machine.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write        # the OIDC token; without this npm refuses

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing requires npm >= 11.5.1. Node 24 already ships an npm 11.x — we check instead of
      # installing, so this workflow is not coupled to npm's release calendar.
      - name: npm can do Trusted Publishing
        run: |
          have="$(npm -v)"; need=11.5.1
          printf '%s\n%s\n' "$need" "$have" | sort -V -C \
            || { echo "::error::npm $have is older than $need"; exit 1; }
          echo "npm $have · node $(node -v)"

      # The tag is the source of truth for the version: publishing 0.1.0 under the tag v0.2.0 puts a wrong number
      # into an immutable registry.
      - name: the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          test "$tag" = "$pkg" || { echo "::error::tag $tag ≠ package.json $pkg"; exit 1; }

      # Includes the tests that PACK and INSTALL the package and call the binary through the symlink — 0.1.0 shipped
      # broken precisely because the check was `node src/index.mjs`, which is the file and not the artifact.
      - run: node --test test/*.test.mjs

      # What goes to the registry, read from the real TARBALL, checked for what must not leave home.
      - name: the tarball carries no internal route and no key
        run: |
          npm pack --silent >/dev/null
          tar -xzOf ./*.tgz > /tmp/bundle.txt
          if grep -nE 'fabapp\.ai/(staff|admin)|sk_live|sk_test|AIza[0-9A-Za-z_-]{20,}|ghp_[0-9A-Za-z]{20,}' /tmp/bundle.txt; then
            echo "::error::the tarball carries an internal route or something shaped like a credential"
            exit 1
          fi

      - run: npm publish --provenance --access public
